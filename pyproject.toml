[project]
name = "ai-phone"
version = "0.0.1"
description = "SIP-native, fully local AI phone appliance"
requires-python = ">=3.11,<3.14"
license = "AGPL-3.0-or-later"
dependencies = [
  "mlx-audio[stt,tts]>=0.5.1; sys_platform == 'darwin'",
  "mlx-lm>=0.31; sys_platform == 'darwin'",
  "misaki[en]>=0.9.4",
  "silero-vad>=5",
  "huggingface_hub>=0.30",
  "numpy>=1.26",
  "soxr>=0.5",
  "pyyaml>=6",
]

[project.scripts]
ai-phone = "ai_phone.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  # Kokoro's phonemizer needs this spaCy model; pinning it here keeps `uv sync` from removing it
  "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_phone"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs pjsua and/or models"]
asyncio_mode = "auto"
pythonpath = ["src"]
