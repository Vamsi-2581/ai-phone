<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">ai-phone — Give your AI a phone.</title>
  <desc id="desc">A mint green desk phone with an orange ringing light, connected by a coiled cord to the ai-phone wordmark on a dark background.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
