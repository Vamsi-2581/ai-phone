    <text x="86" y="111" font-size="17" letter-spacing="3" fill="#b7d4c5">LOCAL VOICE. REAL CALLS.</text>
    <text x="56" y="223" font-size="108" font-weight="700" letter-spacing="-7" fill="#f5f2dc">ai-phone<tspan fill="#ff9d65">_</tspan></text>
    <text x="64" y="278" font-size="28" fill="#b7d4c5">Give your AI a phone.</text>
    <text x="64" y="351" font-size="14" letter-spacing="2" fill="#88aa99">PICK UP / DIAL OUT / LISTEN / SAY</text>
  </g>
